name: Build Marauder

# Builds the two Marauder ESP32-C5 boards (Pancake and V8). Each is a separate
# matrix job because both use BOARD=ESP32_GENERIC_C5 and so share one MicroPython
# build directory — running them in the same job would let one board's config
# leak into the other.
#
# The steps mirror the manual build in guides/Pancake.md, so this file doubles
# as an executable copy of those instructions.

on:
  push:
    branches: [pancake_dev, v8_dev]
    paths:
      - 'src/MicroPython/**'
      - 'tools/micropython-pancake.sh'
      - 'tools/micropython-v8.sh'
      - '.github/workflows/build-marauder.yml'
  pull_request:
    paths:
      - 'src/MicroPython/**'
      - 'tools/micropython-pancake.sh'
      - 'tools/micropython-v8.sh'
      - '.github/workflows/build-marauder.yml'
  workflow_dispatch:
    inputs:
      micropython_ref:
        description: 'MicroPython git ref (must ship the ESP32_GENERIC_C5 board — v1.27.0 or newer)'
        type: string
        default: 'v1.28.0'
      idf_version:
        description: 'ESP-IDF version (v1.28.0 recommends v5.5.1)'
        type: string
        default: 'v5.5.1'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: Pancake
            script: tools/micropython-pancake.sh
          - board: V8
            script: tools/micropython-v8.sh
    env:
      # ESP32_GENERIC_C5 first shipped in MicroPython v1.27.0, and v1.28.0
      # recommends ESP-IDF v5.5.1. Keep these two in step when bumping either.
      MICROPYTHON_REF: ${{ inputs.micropython_ref || 'v1.28.0' }}
      IDF_VERSION: ${{ inputs.idf_version || 'v5.5.1' }}
      BOARD: ESP32_GENERIC_C5

    steps:
      - name: Checkout Picoware
        uses: actions/checkout@v4

      - name: Checkout MicroPython (${{ inputs.micropython_ref || 'v1.28.0' }})
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          ref: ${{ env.MICROPYTHON_REF }}
          path: micropython

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git wget flex bison gperf python3 python3-pip python3-venv \
            cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Cache ESP-IDF and toolchain
        uses: actions/cache@v4
        id: idf-cache
        with:
          path: |
            ~/esp-idf
            ~/.espressif
          key: idf-${{ env.IDF_VERSION }}-esp32c5-${{ runner.os }}

      - name: Install ESP-IDF ${{ env.IDF_VERSION }}
        if: steps.idf-cache.outputs.cache-hit != 'true'
        run: |
          git clone -b "$IDF_VERSION" --depth 1 --recursive \
            https://github.com/espressif/esp-idf.git "$HOME/esp-idf"
          # Only the C5 toolchain is needed, which keeps the cache small.
          "$HOME/esp-idf/install.sh" esp32c5

      - name: Build ${{ matrix.board }} firmware
        run: |
          export ESP_IDF_DIR="$HOME/esp-idf"
          export MICROPYTHON_ROOT="$GITHUB_WORKSPACE/micropython"
          export MICROPYTHON_ESP32_PORT="$MICROPYTHON_ROOT/ports/esp32"

          . "$ESP_IDF_DIR/export.sh"

          # A fresh MicroPython checkout has no submodules fetched yet; the
          # build script (like its Cardputer sibling) assumes they are present.
          make -C "$MICROPYTHON_ESP32_PORT" BOARD="$BOARD" submodules

          bash ${{ matrix.script }}

      - name: Summarize artifacts
        if: always()
        run: |
          if [ -d builds/MicroPython ]; then
            ls -l builds/MicroPython/Picoware-${{ matrix.board }}* 2>/dev/null \
              || echo "no ${{ matrix.board }} artifacts produced"
          fi

      - name: Collect debug symbols
        if: always()
        run: |
          # The .elf turns a Guru Meditation address into a file and line
          # (riscv32-esp-elf-addr2line -pfiaC -e micropython.elf <MEPC>). It must
          # come from the same build as the flashed .bin or the addresses mean
          # nothing.
          mkdir -p debug
          BUILD="micropython/ports/esp32/build-$BOARD"
          cp "$BUILD/micropython.elf" debug/ 2>/dev/null || echo "no elf"
          cp "$BUILD/micropython.map" debug/ 2>/dev/null || echo "no map"
          ls -l debug || true

      - name: Upload ${{ matrix.board }} binaries
        uses: actions/upload-artifact@v4
        with:
          name: Picoware-${{ matrix.board }}
          path: |
            builds/MicroPython/Picoware-${{ matrix.board }}.bin
            builds/MicroPython/Picoware-${{ matrix.board }}-bootloader.bin
            builds/MicroPython/Picoware-${{ matrix.board }}-partition-table.bin
          if-no-files-found: error

      - name: Upload ${{ matrix.board }} debug symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Picoware-${{ matrix.board }}-debug
          path: debug/*
          if-no-files-found: warn
